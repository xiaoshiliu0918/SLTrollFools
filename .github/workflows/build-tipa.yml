name: Build tipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Build tipa
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Collect tipa
        if: success()
        run: |
          VERSION=$(awk -F "=" '/^VERSION/ {print $2}' TrollFools/Version.xcconfig | tr -d ' ')
          BUILD=$(awk -F "=" '/^BUILD_NUMBER/ {print $2}' TrollFools/Version.xcconfig | tr -d ' ')
          echo "NAME=SLTrollFools-${VERSION}-${BUILD}" >> $GITHUB_ENV
          mkdir -p out
          ls -la packages
          cp packages/*.tipa "out/SLTrollFools-${VERSION}-${BUILD}.tipa"
          unzip -l "out/SLTrollFools-${VERSION}-${BUILD}.tipa" | head -30

      - name: Upload tipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*.tipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
